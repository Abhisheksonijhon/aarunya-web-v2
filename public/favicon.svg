<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background circle -->
  <circle cx="16" cy="16" r="16" fill="url(#gradient)" />
  
  <!-- Sun rays -->
  <g id="rays">
    <rect x="15.5" y="4" width="1" height="3" fill="#FFA500" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="15.5" y="25" width="1" height="3" fill="#FFA500" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="4" y="15.5" width="3" height="1" fill="#FFA500" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="25" y="15.5" width="3" height="1" fill="#FFA500" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="0 16 16;360 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="6.5" y="6.5" width="2" height="2" fill="#FFA500" opacity="0.6" transform="rotate(45 16 16)">
      <animateTransform attributeName="transform" type="rotate" values="45 16 16;405 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="23.5" y="23.5" width="2" height="2" fill="#FFA500" opacity="0.6" transform="rotate(45 16 16)">
      <animateTransform attributeName="transform" type="rotate" values="45 16 16;405 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="6.5" y="23.5" width="2" height="2" fill="#FFA500" opacity="0.6" transform="rotate(-45 16 16)">
      <animateTransform attributeName="transform" type="rotate" values="-45 16 16;315 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
    <rect x="23.5" y="6.5" width="2" height="2" fill="#FFA500" opacity="0.6" transform="rotate(-45 16 16)">
      <animateTransform attributeName="transform" type="rotate" values="-45 16 16;315 16 16" dur="20s" repeatCount="indefinite"/>
    </rect>
  </g>
  
  <!-- Letter A -->
  <text x="16" y="22" font-family="Arial, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="white" filter="drop-shadow(0 1px 2px rgba(0,0,0,0.5))">A</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>

